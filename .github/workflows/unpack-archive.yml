name: Unpack repository archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unpack-archive.yml"
      - "swarmwright-0.1.0-fixed.tar.gz"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="swarmwright-0.1.0-fixed.tar.gz"

          if [[ ! -f "$archive" ]]; then
            echo "Archive already removed; nothing to unpack."
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$temp_dir"

          mapfile -t entries < <(find "$temp_dir" -mindepth 1 -maxdepth 1 -printf '%f\n')
          source_dir="$temp_dir"
          if [[ ${#entries[@]} -eq 1 && -d "$temp_dir/${entries[0]}" ]]; then
            source_dir="$temp_dir/${entries[0]}"
          fi

          rsync -a --exclude='.git/' --exclude='.github/workflows/unpack-archive.yml' "$source_dir/" ./
          rm -f "$archive"

      - name: Commit unpacked files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unpack Swarmwright source archive"
          git push
