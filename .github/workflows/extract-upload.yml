name: Extract uploaded Swarmwright archive

on:
  push:
    branches: [main]
    paths:
      - "swarmwright-0.1.0-fixed.tar.gz"
      - ".github/workflows/extract-upload.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="swarmwright-0.1.0-fixed.tar.gz"
          temp_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$temp_dir"
          rsync -a "$temp_dir/swarmwright/" ./
          rm -f "$archive"
          rm -f .github/workflows/extract-upload.yml

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Swarmwright project source"
          git push
