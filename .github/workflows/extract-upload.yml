name: Extract uploaded Swarmwright archive

on:
  push:
    branches: [main]
    paths:
      - "swarmwright-0.1.0-fixed.tar.gz"
      - ".github/workflows/extract-upload.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="swarmwright-0.1.0-fixed.tar.gz"

          if [[ ! -f "$archive" ]]; then
            echo "Archive is already extracted."
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          tar -xzf "$archive" -C "$temp_dir"
          cp -a "$temp_dir/swarmwright/." ./
          rm -f "$archive"

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No files changed."
            exit 0
          fi

          git commit -m "Extract Swarmwright project source"
          git push origin HEAD:main
